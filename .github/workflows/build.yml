name: Build PDFs

on:
  push:
    branches: [master]
    paths: ["**.tex", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile every document
        shell: bash
        run: |
          # PDFs are collected into out/build/<course>/<name>.pdf, mirroring the repo layout.
          mkdir -p out/build
          failed=()
          # Every file with \documentclass is a standalone document.
          while IFS= read -r f; do
            dir=$(dirname "$f"); name=$(basename "$f" .tex)
            # "..:" puts the repo root on the search path so \input{header} resolves.
            if (cd "$dir" && TEXINPUTS="..:" latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build "$name.tex" > /dev/null); then
              dest="out/build/${dir#./}"
              mkdir -p "$dest"
              cp "$dir/build/$name.pdf" "$dest/$name.pdf"
              echo "built  $f"
            else
              failed+=("$f")
              echo "::warning file=$f::Failed to compile $f"
            fi
          done < <(grep -rl --include='*.tex' '\\documentclass' . | sort)
          echo "Built $(find out/build -name '*.pdf' | wc -l) PDFs, ${#failed[@]} failed: ${failed[*]}"

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: out/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: out

      - name: Zip the build directory
        run: cd out && zip -rq ../build.zip build

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build.zip \
            --target "${{ github.sha }}" \
            --title "Latest PDFs" \
            --notes "Built automatically from ${{ github.sha }}."
